name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: |
          set +e
          npm run test:unit > unit.log 2>&1
          code=$?
          cat unit.log
          if [ $code -ne 0 ]; then
            grep -E "FAIL|Error|error|AssertionError|expected|actual" unit.log | head -20 | while IFS= read -r line; do
              echo "::error::unit: ${line}"
            done
          fi
          exit $code
      - name: Scale test
        run: |
          set +e
          npm run test:scale > scale.log 2>&1
          code=$?
          cat scale.log
          if [ $code -ne 0 ]; then
            tail -20 scale.log | while IFS= read -r line; do
              echo "::error::scale: ${line}"
            done
          fi
          exit $code
